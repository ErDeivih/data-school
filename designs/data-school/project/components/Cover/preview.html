<!-- @dsCard height=300 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Data School</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  /* composición: caja de 480px en la mitad derecha del lienzo de 960; el nombre vive a la izquierda */
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:640px; height:300px; }
  .slab-accent { fill:var(--accent); }
  .slab-ink { fill:var(--ink); }
  .slab-tint { fill:var(--accent-soft); }
  .rule { stroke:var(--line-strong); stroke-width:1; }
  .dot-verified { fill:var(--verified); }
  .dot-broken { fill:var(--broken); }
  .dot-pending { fill:var(--pending); }
  .blk { rx:var(--radius-md); }
  .dot { r:6px; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:104px; line-height:.9; font-weight:700; letter-spacing:-.015em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 640 300" width="640" height="300">
<!--
  bloques      accent 144×340 bleed arriba y abajo (el primario, el mayor) · ink 112×204 satélite · accent-soft 304×176 bleeding por la derecha · 3 discos de estado de 12px (verified/pending/broken) — ≈32% de 960×300; los colores de estado solo aparecen como punto, según «un color que solo significa estado se queda pequeño»
  disposición  una losa accent alta con satélites, bases sobre dos líneas claras, canaletas space-4/space-6, sangrado por arriba, abajo y derecha
  patrón       el libro de registro del producto: 5 filetes line-strong a paso space-8 cruzando la caja, con los tres discos de estado en la canaleta — el catálogo se comprueba fila a fila
  escalas      lados en múltiplos de space-2/space-6; canaletas space-4 y space-6; paso vertical space-8 (40px); esquinas radius-md; discos r=6px (media altura de un disco de 12, radio completo)
-->
<line class="rule" x1="0" y1="28" x2="640" y2="28"/>
<line class="rule" x1="0" y1="76" x2="640" y2="76"/>
<line class="rule" x1="0" y1="124" x2="640" y2="124"/>
<line class="rule" x1="0" y1="172" x2="640" y2="172"/>
<line class="rule" x1="0" y1="220" x2="640" y2="220"/>
<rect class="slab-accent blk" x="16" y="-20" width="144" height="340" rx="6"/>
<rect class="slab-ink blk" x="192" y="48" width="112" height="204" rx="6"/>
<rect class="slab-tint blk" x="336" y="104" width="304" height="176" rx="6"/>
<circle class="dot dot-verified" cx="320" cy="76" r="6"/>
<circle class="dot dot-pending" cx="320" cy="124" r="6"/>
<circle class="dot dot-broken" cx="320" cy="172" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Data<br>School</h1>
<p class="tag">Enlazar, comprobar y resumir. Nunca copiar.</p>
</div>
</div>
</body>
</html>
